<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="coin" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#f0c24d"/>
      <stop offset="1" stop-color="#d9a21f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#12452a"/>
  <!-- snow -->
  <g fill="#fff" opacity="0.75">
    <circle cx="70" cy="90" r="6"/><circle cx="440" cy="70" r="5"/><circle cx="470" cy="190" r="4"/>
    <circle cx="48" cy="250" r="4"/><circle cx="455" cy="420" r="6"/><circle cx="60" cy="430" r="5"/>
    <circle cx="150" cy="40" r="4"/><circle cx="370" cy="470" r="4"/>
  </g>
  <!-- peppermint ring (circumference of r=182 is 1143.6; 48 stripes of ~23.8) -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#fff" stroke-width="30"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#c0392b" stroke-width="30" stroke-dasharray="23.8 23.8" transform="rotate(-90 256 256)"/>
  <!-- coin -->
  <circle cx="256" cy="256" r="150" fill="url(#coin)" stroke="#7a5a00" stroke-width="10"/>
  <circle cx="256" cy="256" r="124" fill="none" stroke="#d9a21f" stroke-width="5" opacity="0.8"/>
  <!-- tree -->
  <rect x="242" y="338" width="28" height="30" rx="3" fill="#6b3a1e"/>
  <polygon points="256,168 322,262 290,262 336,324 176,324 222,262 190,262" fill="#2f6b35" stroke="#12452a" stroke-width="6" stroke-linejoin="round"/>
  <!-- star -->
  <polygon points="256,140 264,160 286,162 269,176 275,198 256,186 237,198 243,176 226,162 248,160" fill="#c0392b" stroke="#7b1f14" stroke-width="4" stroke-linejoin="round"/>
  <!-- ornaments -->
  <circle cx="246" cy="272" r="8" fill="#c0392b"/><circle cx="278" cy="296" r="8" fill="#f6e4ee"/><circle cx="232" cy="310" r="7" fill="#f0c24d" stroke="#7a5a00" stroke-width="2"/>
</svg>
