<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pa's Christmas Energy Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#12452a;color:#2b2420;min-height:100vh;padding-bottom:40px;overflow-x:hidden;width:100%}
#app{width:100%;max-width:560px;margin:0 auto;padding:0 10px;--pc:#8e2a55;--pl:#f6e4ee;--bb:#8e2a55;--bt:#fff}
#app.R{--pc:#a63f2c;--pl:#f6e2de;--bb:#a63f2c}#app.Y{--pc:#8a5f0b;--pl:#f8efd8;--bb:#f0c24d;--bt:#2b2420}#app.G{--pc:#3f7a49;--pl:#e1eedf;--bb:#3f7a49}
header{text-align:center;color:#fff;padding:14px 0 6px}
header{position:relative;overflow:hidden}
header h1{position:relative;z-index:1}
.snow{position:absolute;inset:0;pointer-events:none}
.snow i{position:absolute;top:-8px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.7;animation:fall var(--d) linear var(--l) infinite}
@keyframes fall{to{transform:translateY(90px) translateX(12px);opacity:0}}
@media (prefers-reduced-motion:reduce){.snow{display:none}}

header h1{font-size:1.45rem;line-height:1.15;overflow-wrap:anywhere}
.cane{height:10px;background:repeating-linear-gradient(135deg,#c0392b 0 8px,#fff 8px 16px);border-radius:5px;margin:6px 0 10px}
.datebar{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0 10px}
.datebar button{width:44px;height:44px;border-radius:50%;border:2px solid #ffe9a0;background:#c0392b;color:#fff;font-size:1.3rem;font-weight:800;flex:none}
.datebar .dt{flex:1;max-width:200px;text-align:center;background:#fffaf0;border-radius:12px;padding:10px 6px;font-weight:800}
.datebar .todaybtn{width:auto;border-radius:12px;padding:0 10px;font-size:.9rem}
.card{background:#fffaf0;border-radius:14px;padding:12px;margin:10px 0;border:2px solid #e6dcc6;border-top:7px solid var(--ac,#e6dcc6);min-width:0}
.card h2{font-size:1.1rem;color:#a52a1d;margin-bottom:6px}
.card h2 small{font-weight:500;color:#4a3d30;font-size:.9rem;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.lbl{font-weight:800;color:#2f6b35;width:70px;text-transform:uppercase;font-size:.85rem;letter-spacing:.03em;flex:none}
.chip{min-height:44px;padding:0 12px;border-radius:12px;border:3px solid var(--k,#b9a98f);background:#fff;font-size:1rem;font-weight:700;color:#2b2420}
.chip.lv,.num.lv{background:var(--k);border-color:var(--k);color:var(--kt);opacity:.62}
.chip.on{background:var(--k,var(--pc));border-color:#2b2420;color:var(--kt,#fff)}
.num{width:42px;height:42px;border-radius:50%;border:3px solid var(--k,#b9a98f);background:#fff;font-size:.95rem;font-weight:800}
.g5,.g6{display:grid;gap:6px;width:100%}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g5 .num,.g6 .num{width:100%;height:44px;border-radius:12px}
.num.on{background:var(--k,var(--pc));border-color:#2b2420;color:var(--kt,#fff)}
input[type=text]{font-size:1rem;height:44px;border-radius:12px;border:2px solid #b9a98f;padding:0 10px;background:#fff;min-width:0;flex:1}
.bar{position:sticky;top:0;z-index:20;margin:8px 0;padding:10px;border-radius:14px;color:var(--bt);background:var(--bb);border:2px solid rgba(0,0,0,.12)}
.bar .top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cbtn{min-height:54px;border-radius:12px;border:2px solid var(--bt);background:transparent;color:var(--bt);font-weight:800;font-size:1rem;padding:2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.cbtn span{font-weight:600;font-size:.85rem}
.cbtn.on{background:var(--bt);color:var(--bb)}
.cbtn .dot{display:block;width:14px;height:14px;border-radius:50%;background:var(--k);border:2px solid var(--bt);margin-bottom:2px}
.cbtn.cR{--k:#e0533f}.cbtn.cY{--k:#f0c24d}.cbtn.cG{--k:#4fb261}
.cbtn.on .dot{border-color:var(--bb)}
.bar .coins{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 6px}
.coin{width:26px;height:26px;border-radius:50%;border:2px solid #7a5a00;background:radial-gradient(circle at 35% 30%,#fff3b0,#f0c24d 60%,#d9a21f);position:relative}
.coin.x{background:#6b1f2a;border-color:#3d0f16}
.coin.x::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd9d4;font-weight:900;font-size:.9rem}
.left{font-size:1.05rem;font-weight:800}
.left small{font-weight:500;font-size:.9rem}
.done{margin-top:6px;background:#fffaf0;color:#a52a1d;border-radius:10px;padding:8px 10px;font-weight:800;font-size:.95rem}
.hint{font-size:.9rem;color:#4a3d30;margin-top:4px}
.bar .hint{color:var(--bt)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.q{min-height:52px;border-radius:12px;border:3px solid var(--k,var(--pc));background:var(--kl,var(--pl));font-size:.95rem;font-weight:700;color:#2b2420;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px;text-align:left;min-width:0}
.q span{min-width:0;overflow-wrap:anywhere}
.q b,.item b{background:var(--k,var(--pc));color:var(--kt,#fff);border-radius:50%;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex:none}
details{margin-top:8px}
details.sub2{border:2px solid #e6dcc6;border-radius:12px;background:#fff;padding:2px 10px 8px}
details.sub2>summary{font-size:1rem;padding:10px 0}
summary{min-height:44px;display:flex;align-items:center;font-weight:800;color:#a52a1d;font-size:1rem;cursor:pointer}
.tier{margin:8px 0 2px;font-weight:800;display:inline-block;border-radius:999px;padding:1px 12px;background:var(--k,var(--pc));color:var(--kt,#fff);font-size:.9rem}
.item{width:100%;min-height:44px;border-radius:10px;border:3px solid var(--k,var(--pc));background:var(--kl,var(--pl));margin:3px 0;display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:1rem;font-weight:600;text-align:left;gap:8px;color:#2b2420}
.item span{min-width:0;overflow-wrap:anywhere}
.note{font-size:.9rem;color:#7a3b2e}
.entry{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eadfc9;border-left:6px solid var(--k,#8e2a55);padding:6px 0 6px 8px;font-size:.95rem}
.entry .t{color:#5a4a3a;font-size:.85rem;width:48px;flex:none}
.entry .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.entry .cc{background:var(--k,#f3d98b);color:var(--kt,#2b2420);border-radius:10px;padding:0 8px;font-weight:800;font-size:.85rem;flex:none}
.entry .rm{width:38px;height:38px;border-radius:50%;border:2px solid #c0392b;background:#fff;color:#c0392b;font-weight:900;flex:none}
.empty{color:#5a4a3a;padding:4px 0}
.big{width:100%;min-height:52px;border-radius:14px;border:2px solid #1d4a24;background:#2f6b35;color:#fff;font-size:1.05rem;font-weight:800;margin:6px 0;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.big.pale{background:#fff;color:#2f6b35}
.past{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #eadfc9;padding:8px 0}
.past .pd{font-weight:800}.past .ps{font-size:.9rem;color:#5a4a3a;overflow-wrap:anywhere}
.small{min-height:42px;padding:0 12px;border-radius:12px;border:2px solid #2f6b35;background:#fff;color:#2f6b35;font-weight:800;font-size:.9rem}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:42px;height:42px;border-radius:50%;border:2px solid #2f6b35;background:#fff;font-size:1.2rem;font-weight:900;color:#2f6b35}
.stepper span{min-width:64px;text-align:center;font-weight:800;font-size:.95rem}
footer{text-align:center;color:#ffe9a0;margin:14px 0;font-size:.9rem}
.toast button{margin-left:10px;min-height:40px;padding:0 14px;border-radius:10px;border:2px solid #2f6b35;background:#2f6b35;color:#fff;font-weight:800;font-size:1rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fffaf0;color:#2b2420;border:2px solid #2f6b35;border-radius:14px;padding:10px 16px;font-weight:800;z-index:80;max-width:90vw}
.rd{font-weight:800;color:#a52a1d;text-transform:none;letter-spacing:0;font-size:.9rem}
.chip,.num,.q,.item,.cbtn,.big{transition:transform .1s ease,opacity .15s ease}
.chip:active,.num:active,.q:active,.item:active,.cbtn:active,.big:active{transform:scale(.94)}
.pop{animation:pop .3s ease-out both}
@keyframes pop{0%{transform:scale(.78)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.fb{display:flex;align-items:stretch;min-width:0;min-height:52px;border:3px solid var(--k);border-radius:12px;background:var(--kl);overflow:hidden}
.fb button{border:0;background:transparent;color:#2b2420;font:inherit;cursor:pointer;padding:0;border-radius:0}
.fb button:active{background:rgba(0,0,0,.1)}
.fb .fm{width:42px;flex:none;font-size:1.8rem;font-weight:900;color:var(--k);line-height:1;border-right:2px solid var(--k)}
.fb .fn{flex:1;min-width:0;text-align:left;padding:4px 6px;font-size:.95rem;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.fb .fn0{padding-left:10px}
.fb .fn span{overflow-wrap:anywhere}
.fb .fn small{font-weight:600;font-size:.8rem;color:#4a3d30}
.fb .fp{width:46px;flex:none;display:flex;align-items:center;justify-content:center}
.fb .fp b{background:var(--k);color:var(--kt);border-radius:50%;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}
.fb .fp em{font-style:normal;font-weight:900;font-size:1.6rem;color:var(--k);line-height:1}
.fb.pk-on{outline:3px solid #2b2420}
.pk{grid-column:1/-1;border:3px solid var(--k);border-radius:12px;background:#fff;padding:8px;min-width:0}
.pkh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:6px}
.pkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin-bottom:6px}
.pkb{min-height:54px;border-radius:12px;border:3px solid var(--k);background:var(--kl);color:#2b2420;font:inherit;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:2px 4px;cursor:pointer}
.pkb small{font-weight:600;font-size:.8rem;color:#4a3d30}
.pkb:active{background:var(--k);color:var(--kt)}
.calin{width:90px!important;flex:none!important;text-align:center}
.ed{margin:6px 0 10px;padding:8px;border:2px solid #e6dcc6;border-radius:12px;background:#fff}
.ed input[type=text]{width:100%;flex:none;margin-bottom:2px}
.pick{height:44px;border-radius:12px;border:2px solid #b9a98f;background:#fff;font-size:1rem;padding:0 8px;min-width:0;color:#2b2420}
.small.del{border-color:#c0392b;color:#c0392b}
.dash .dg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:4px 0 12px}
.dash .dt2{font-weight:800;color:#a52a1d;font-size:1.05rem;margin-top:8px}
.dc{border:3px solid transparent;border-radius:12px;background:transparent;padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-width:0;color:#2b2420;font-weight:800;font-size:.9rem;text-align:center;cursor:pointer}
.dc>*{flex:none}
.dc.sel{border-color:#2b2420;background:#fff}
.dc .wd{font-size:.9rem}.dc .dn{font-size:.85rem;font-weight:600;color:#4a3d30}.dc .sub{font-size:.75rem;font-weight:700;min-height:1em;white-space:nowrap}
.lights{overflow:hidden}
.bulb{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:38px;margin-top:8px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--k);color:var(--kt);font-style:normal;font-weight:900;font-size:1rem;border:2px solid rgba(0,0,0,.4)}
.bulb::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:14px;height:8px;background:#5a4a3a;border-radius:3px 3px 0 0}
.bulb::after{content:"";position:absolute;top:-6px;left:-60px;right:-60px;height:2px;background:#5a4a3a}
.bulb.off{background:transparent;border:2px dashed #b9a98f;color:#8a7a66}
.vb{display:flex;align-items:flex-end;width:28px;height:60px;border:2px solid #b9a98f;border-radius:8px;background:#fff;overflow:hidden}
.vb i{display:block;width:100%}
.vb.none{border-style:dashed;background:transparent}
.nv{font-weight:800;font-size:.9rem;min-height:1.1em}
.pc{display:flex;align-items:center;justify-content:center;min-width:32px;height:32px;border-radius:50%;background:var(--k);color:var(--kt);font-weight:800;font-size:1rem}
.pc.none{background:transparent;border:2px dashed #b9a98f;color:#8a7a66}
.cr b{font-size:1.35rem;line-height:1}.cr small{font-size:.8rem;font-weight:700}
.cr.y b{color:#c0392b}.cr.n b{color:#26804a}.cr.none b{color:#8a7a66}
.dsum{list-style:none;margin-top:4px}
.dsum li{padding:8px 2px;border-top:1px solid #eadfc9;font-size:1rem}
.dsum li.nudge{background:#e1eedf;border-radius:10px;padding:10px;font-weight:700;margin-top:6px;border-top:0}
</style>
</head>

function wr(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}

 return s&&s.R?s:{R:3,Y:6,G:10}}

/* food buttons and own activities: saved on this phone; bad data falls back to the originals */
/* calories are now saved per unit (per oz, per cup...). Older saves were per tap, so they are converted once. */
function itemKey(n){var l=String(n).toLowerCase();for(var k in ITEMS)if(k.toLowerCase()===l)return k;return null}
function loadCal(){var r=rd('pa-cal2'),q,mig=false;if(r===null){r=rd('pa-cal');mig=r!==null}
 try{q=r?JSON.parse(r):{}}catch(e){q={}}
 if(!q||typeof q!=='object'||Array.isArray(q))return {};
 var o={};for(var k in q){var v=q[k];if(v===null)o[k]=null;else if(typeof v==='number'&&v>=0&&v<=5000){if(mig){var ik=itemKey(k);v=Math.round(v/(ik?ITEMS[ik].d:1)*10)/10}o[k]=v}}return o}
function saveCal(){wr('pa-cal2',JSON.stringify(ucal))}
function loadUnits(){var r=rd('pa-units'),q;try{q=r?JSON.parse(r):{}}catch(e){q={}}
 if(!q||typeof q!=='object'||Array.isArray(q))return {};
 var o={};for(var k in q){if(typeof q[k]==='string'&&TLBL[q[k]])o[k]=q[k]}return o}
function saveUnits(){wr('pa-units',JSON.stringify(uunit))}
function unitOf(n){var k=itemKey(n),b=k?ITEMS[k]:{t:'count',u:'piece',p:'pieces',c:null,d:1};
 var r={t:b.t,u:b.u||NOUN[b.t][0],p:b.p||NOUN[b.t][1],c:b.c,d:b.d,o:b.o||PRE[b.t],tag:b.tag||{},s:b.s||''};
 var ov=Object.prototype.hasOwnProperty.call(uunit,n)?uunit[n]:null;
 if(ov&&ov!==b.t){r.t=ov;r.u=NOUN[ov][0];r.p=NOUN[ov][1];r.o=PRE[ov];r.tag={};r.c=null;r.d=1;r.s=''}
 return r}
function calOf(n){if(Object.prototype.hasOwnProperty.call(ucal,n))return ucal[n];var c=unitOf(n).c;return c===undefined?null:c}
function frac(n){var w=Math.floor(n+1e-9),r=n-w,m={'0.25':'¼','0.5':'½','0.75':'¾'},s='';
 for(var k in m){if(Math.abs(r-parseFloat(k))<0.01)s=m[k]}
 if(s)return (w?String(w):'')+s;
 return String(Math.round(n*100)/100)}
function unitWord(q,n){var u=unitOf(n);return q>1?u.p:u.u}
function fmtQ(q,n){return frac(q)+' '+unitWord(q,n)}
function amtText(e){if(e.q!==undefined&&e.q!==null&&!isNaN(e.q))return frac(e.q)+' '+(e.un||unitWord(e.q,e.x));return e.a?String(e.a):''}
function parseQty(s){s=String(s).trim().replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').trim();if(!s)return null;
 var p=s.split(/\s+/),t=0;
 for(var i=0;i<p.length;i++){var m=p[i].match(/^(\d+)\/(\d+)$/);
  if(m){if(+m[2]===0)return null;t+=(+m[1])/(+m[2])}else if(/^(\d+\.?\d*|\.\d+)$/.test(p[i]))t+=parseFloat(p[i]);else return null}
 return (t>0&&t<=50)?Math.round(t*100)/100:null}
function logCal(log){var t=0,miss=0;log.forEach(function(e){if(e.k!=='ate')return;var c=calOf(e.x);if(c===null||c===undefined)miss++;else t+=c*((e.q!==undefined&&e.q!==null)?e.q:unitOf(e.x).d)});return {t:Math.round(t),miss:miss}}
function defaultFoods(){return FOODS.map(function(g){return {n:g[0],c:g[1],l:g[2],items:g[3].slice()}})}
function loadFoods(){var d=defaultFoods();var s=rd('pa-foods');try{s=s?JSON.parse(s):null}catch(e){s=null}
 if(!Array.isArray(s)||s.length!==3)return d;
 for(var i=0;i<3;i++){if(!Array.isArray(s[i]))return d}
 for(var j=0;j<3;j++)d[j].items=s[j].filter(function(x){return typeof x==='string'&&x.trim()}).map(function(x){return x.trim()});
 return d}
function saveFoods(){wr('pa-foods',JSON.stringify(foods.map(function(g){return g.items})))}
function loadActs(){var s=rd('pa-acts');try{s=s?JSON.parse(s):[]}catch(e){s=[]}
 if(!Array.isArray(s))return [];
 return s.filter(function(a){return Array.isArray(a)&&typeof a[0]==='string'&&a[0].trim()&&typeof a[1]==='number'&&a[1]>=0&&a[1]<=10})}
function saveActs(){wr('pa-acts',JSON.stringify(acts))}
function foodCanon(n){var l=String(n).toLowerCase();for(var g=0;g<foods.length;g++)for(var i=0;i<foods[g].items.length;i++)if(foods[g].items[i].toLowerCase()===l)return foods[g].items[i];return null}

function load(d){var v=rd('pa-log-'+d);if(!v)return blank();try{var o=JSON.parse(v);var b=blank();for(var k in o)b[k]=o[k];return b}catch(e){return blank()}}

function summaryOf(o,d){
 var s=0;o.log.forEach(function(e){if(e.k==='did')s+=e.c||0});
 var c=o.color,t=c?(o.totals&&o.totals[c]?o.totals[c]:cfg[c]):0;
 var parts=['Energy log'];
 parts.push(c?CN[c]:'No color');
 if(c)parts.push(s+' of '+t+' coins');
 if(o.crash==='Yes')parts.push('Crash');else if(o.crash==='No')parts.push('No crash');
 return parts.join(' · ');
}
function detailsOf(o,d){
 var L=[];
 var sl=[];if(o.sleepH!=='')sl.push(o.sleepH+' hours');if(o.sleepQ)sl.push(o.sleepQ);if(o.nap!=='')sl.push('nap '+o.nap+' h');
 if(sl.length)L.push('Sleep: '+sl.join(', '));
 if(o.eyes&&o.eyes.length)L.push('Eyes: '+o.eyes.join(', '));
 if(o.pain!==null&&o.pain!==undefined){L.push('Pain: '+o.pain+'/10'+(o.painWhere?' · where: '+o.painWhere:'')+(o.painWhen?' · when: '+o.painWhen:''))}
 var en=[];['Morning','Afternoon','Evening'].forEach(function(p){if(o.energy&&o.energy[p])en.push(p+' '+o.energy[p])});
 if(en.length)L.push('Energy (1-5): '+en.join(', '));
 if(o.gas)L.push('Ran out of gas at: '+o.gas);
 var ate=o.log.filter(function(e){return e.k==='ate'}).sort(function(a,b){return a.t<b.t?-1:1});
 if(showFood&&ate.length){L.push('Ate:');ate.forEach(function(e){var am=amtText(e);L.push('  '+e.t+' '+e.x+(am?' — '+am:''))})}
 if(showFood&&showCal&&ate.length){var lc=logCal(o.log);if(lc.t)L.push('Calories (rough guess): about '+lc.t+(lc.miss?' ('+lc.miss+' without a number)':''))}
 var did=o.log.filter(function(e){return e.k==='did'}).sort(function(a,b){return a.t<b.t?-1:1});
 if(did.length){L.push('Did:');did.forEach(function(e){L.push('  '+e.t+' '+e.x+' ('+e.c+')')})}
 return L.join('\n');
}
function calUrl(d,o){

}

/* ---------- week dashboard ---------- */
var PCOL={R:['#c0392b','#fff'],Y:['#f0c24d','#2b2420'],G:['#2f7d46','#fff']};
function addDays(s,n){var p=s.split('-');return ds(new Date(+p[0],+p[1]-1,+p[2]+n))}

function dayData(d){
 var o=load(d),ev=[],sp=0;

}
function dashHtml(){

 function wdn(d){var p=d.split('-');return {w:new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:'short'}),n:+p[2]}}

 function row(title,cls,fn){return '<div class="dt2">'+title+'</div><div class="dg'+(cls?' '+cls:'')+'">'+days.map(function(x){return cell(x,fn(x))}).join('')+'</div>'}

 h+='<div class="hint">The coin numbers are in the Coin numbers box above.</div></details></div>';
 h+='<footer>Saved on this phone. Rest is part of the job.</footer>';
 var app=document.getElementById('app');
 app.className=day.color||'';
 var sy=window.pageYOffset;
 var openIdx=[];var ds2=document.querySelectorAll('details');for(var di=0;di<ds2.length;di++){if(ds2[di].open)openIdx.push(di)}
 app.innerHTML=h;
 var nd=document.querySelectorAll('details');openIdx.forEach(function(ix){if(nd[ix])nd[ix].open=true});
 window.scrollTo(0,sy);
 if(popG){var gl=document.querySelectorAll('[data-g="'+popG+'"]');for(var gi=0;gi<gl.length;gi++){var el=gl[gi];if(el.classList.contains('on')||el.classList.contains('lv')){el.classList.add('pop');el.style.animationDelay=(parseInt(el.getAttribute('data-i'),10)*30)+'ms'}}}
 else if(popA){var al=document.querySelectorAll('[data-a="'+popA+'"]');for(var ai=0;ai<al.length;ai++){if(al[ai].classList.contains('on')&&al[ai].getAttribute('data-v')===popV)al[ai].classList.add('pop')}}
 popG=null;popA=null;popV=null;
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var b=ev.target.closest?ev.target.closest('[data-a]'):null;
 if(!b)return;
 var a=b.getAttribute('data-a');
 var g=b.getAttribute('data-g');popG=g||null;popA=g?null:a;popV=b.getAttribute('data-v');
 act(a,b.getAttribute('data-v'));
});
document.addEventListener('input',function(ev){
 var id=ev.target.id;
 if(id==='pw'){day.painWhere=ev.target.value;save()}
 else if(id==='pwn'){day.painWhen=ev.target.value;save()}
 else if(id==='elsetx'){elseText=ev.target.value}
 else if(id==='gas'){day.gas=ev.target.value;save()}
 else if(id==='atime'){addTime=ev.target.value}
});
document.addEventListener('change',function(ev){
 var t=ev.target,ed=t.getAttribute?t.getAttribute('data-ed'):null;if(!ed)return;
 var g=parseInt(t.getAttribute('data-g'),10),i=parseInt(t.getAttribute('data-i'),10);
 if(ed==='fname'){
  var nm=t.value.trim(),old=foods[g]&&foods[g].items[i];
  if(old===undefined||!nm||nm===old){render();return}
  var ex=foodCanon(nm);
  if(ex&&ex.toLowerCase()!==old.toLowerCase()){toast('That name is already used');render();return}
  var oc=calOf(old),ot=unitOf(old).t;foods[g].items[i]=nm;saveFoods();uunit[nm]=ot;delete uunit[old];saveUnits();if(oc!==null&&oc!==undefined){ucal[nm]=oc;saveCal()}
  day.log.forEach(function(e){if(e.k==='ate'&&e.x===old)e.x=nm});save();
  render();toast('Renamed');
 }else if(ed==='fcal'){
  var fn=foods[g]&&foods[g].items[i];
  if(fn!==undefined){var raw=t.value.replace(/[^0-9]/g,'');ucal[fn]=raw===''?null:Math.min(5000,parseInt(raw,10));saveCal()}
  render();
 }else if(ed==='funit'){
  var un=foods[g]&&foods[g].items[i];
  if(un!==undefined&&TLBL[t.value]&&unitOf(un).t!==t.value){uunit[un]=t.value;delete ucal[un];saveUnits();saveCal();toast('Now measured in '+TLBL[t.value]+'. Check the calories.')}
  render();
 }else if(ed==='fgrp'){
  var to=parseInt(t.value,10);
  if(foods[g]&&foods[to]&&to!==g){var it=foods[g].items.splice(i,1)[0];foods[to].items.push(it);saveFoods();render();toast('Moved to '+foods[to].n)}
 }else if(ed==='aname'){
  var an=t.value.trim().replace(/\|/g,'/');if(an&&acts[i]){acts[i][0]=an;saveActs()}render();
 }else if(ed==='acost'){
  if(acts[i]){acts[i][1]=parseInt(t.value,10)||0;saveActs()}render();
 }
});
/* the calendar link needs fresh details: refresh the href when pressed */
document.addEventListener('pointerdown',function(ev){
 var a=ev.target.closest?ev.target.closest('a.big'):null;
 if(a){a.setAttribute('href',calUrl(date,day))}
});

window.__pa={act:act,get day(){return day},get date(){return date},summaryOf:summaryOf,detailsOf:detailsOf,calUrl:calUrl,get cfg(){return cfg}};
render();
})();
</script>
</body>
